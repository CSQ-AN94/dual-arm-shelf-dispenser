# Grabber机器人配置文件（双臂 Realman 版本）
# 单位说明：
# - 距离/位置：米(m)
# - 角度：弧度(rad)，关节角度：度(deg)
# - 速度：关节速度百分比
# - 夹爪开度：0.0=完全闭合，1.0=完全张开

# 硬件连接配置（双臂）
connections:
  left_arm_ip: "169.254.128.18"
  right_arm_ip: "169.254.128.19"
  arm_port: 8080
  active_arm: "right"   # 当前用于抓取的手臂，"left" 或 "right"

# 机械臂配置 - 关节角度单位：度(deg)，7个关节
# !! 以下位姿为占位值，需在双臂机器人上重新标定 !!
arm:
  home_pose:          [0, 0, 0, 0, 0, 0, 0]
  scanning_pose:      [0, 0, 0, 0, 0, 0, 0]
  zero_pose:          [0, 0, 0, 0, 0, 0, 0]
  dropoff_pose:       [0, 0, 0, 0, 0, 0, 0]
  checkout_scan_pose: [0, 0, 0, 0, 0, 0, 0]

  # 笛卡尔坐标位姿 - 单位：米(m)和弧度(rad)，[x, y, z, rx, ry, rz]
  # !! 以下为占位值，需在双臂机器人上重新标定 !!
  scanning_pose_cartesian:     [0.3, 0.0, 0.5, 0.0, 1.571, 0.0]
  zero_pose_cartesian:         [0.0, 0.0, 0.8, 0.0, 0.0, 0.0]
  dropoff_pose_cartesian:      [0.0, 0.4, 0.4, 0.0, 1.571, 0.0]
  checkout_scan_pose_cartesian: [0.0, 0.0, 0.8, 0.0, 0.0, 0.0]
  lower_grasp_pose_cartesian:  [0.3, 0.1, 0.3, 0.0, 1.571, 0.0]

# 夹爪配置（Realman Plus 内置夹爪，JSON 指令控制，不再走 Modbus RTU）
gripper:
  open_time: 2.0   # 从全闭到全开所需时间（秒），用于动作后 sleep 等待

# UGV移动底盘配置
ugv:
  max_dist: 1.0
  speed: 0.1

# 手眼标定配置。统一约定：T_A_to_B 表示把 B 坐标系中的点变换到 A 坐标系，
# 即 p_A = T_A_to_B @ p_B；距离单位均为米。
calibration:
  # 右腕 eye-in-hand，2026-07-15；13/13检测成功。
  # 自洽性：平移 max=22.8mm/mean=11.0mm，旋转 max=2.84deg/mean=1.18deg（中等）。
  T_end_right_to_camera_rightwrist:
    - [ 0.005539677,  0.999718374, -0.023075644, -0.084423838]
    - [-0.999984392,  0.005554952,  0.000597902,  0.041327457]
    - [ 0.000725918,  0.023071971,  0.999733543, -0.036106544]
    - [ 0.0,          0.0,          0.0,          1.0]

  # 左腕 eye-in-hand，2026-07-15；13/13检测成功。
  # 自洽性：平移 max=19.6mm/mean=9.5mm，旋转 max=3.44deg/mean=1.25deg（中等）。
  T_end_left_to_camera_leftwrist:
    - [-0.023168437, -0.999507359, -0.021172234,  0.085819618]
    - [ 0.999551582, -0.022757218, -0.019461365, -0.041709882]
    - [ 0.018969957, -0.021613629,  0.999586410, -0.027796293]
    - [ 0.0,          0.0,          0.0,          1.0]

  # 头部相机(base_0) eye-to-hand 真实标定结果，2026-07-08 用
  # scripts/run_eye_to_hand_calibration.py 实测标定，13/13姿态成功检测棋盘格，
  # 且通过了自洽性验证（平移两两差异 max=9.3mm/mean=4.7mm，旋转两两差异
  # max=1.09deg/mean=0.47deg，达到"一致性良好"标准）——这是第一次真正可信的结果，
  # 之前几次因为标定板从夹爪上掉落重装、位置偏移，标出来的都被自洽性检查拒绝了。
  # 前提：头部舵机固定在 scripts/head_position_lock.py 的 HEAD_REFERENCE
  # (angle1=398, angle2=516)，标左臂那轮之前不能再动头部。
  T_base_right_to_camera_head:
    - [ 0.999137569369,  0.003109408458, -0.041405906039, -0.097558797072]
    - [ 0.038865197566, -0.421034572037,  0.906211556739,  0.108446730435]
    - [-0.014615536049, -0.907039260853, -0.420792306699,  0.199436972206]
    - [ 0.0,             0.0,             0.0,             1.0]

  # 头部相机(base_0) eye-to-hand 真实标定结果，左臂版，2026-07-14
  # scripts/run_eye_to_hand_calibration_left.py 实测标定，13/13姿态成功检测棋盘格，
  # 自洽性验证为"中等"档（平移两两差异 max=12.8mm/mean=5.7mm，旋转两两差异
  # max=1.09deg/mean=0.51deg——比右臂那次略松，平移刚好超过"良好"的1cm门槛，
  # 但没有被拒绝），可用但精度不如右臂那份，低精度试验没问题。
  # 前提：头部舵机跟标右臂那轮时是同一个基准值 (angle1=398, angle2=516)，
  # 全程没有移动过，两轮结果可以直接喂给 compose_dual_arm_transform.py 组合。
  T_base_left_to_camera_head:
    - [ 0.998445384468,  0.026810231254, -0.048867430196,  0.017337691270]
    - [ 0.055623691326, -0.422941658274,  0.904448096167,  0.101502470814]
    - [ 0.003580390653, -0.905760213962, -0.423775430631,  0.185169411063]
    - [ 0.0,             0.0,             0.0,             1.0]

  # 由两套头部 eye-to-hand 外参组合得到：
  # T_base_right_to_base_left = T_base_right_to_camera_head
  #                              @ inv(T_base_left_to_camera_head)
  T_base_right_to_base_left:
    - [ 0.999691058769,  0.016811128493,  0.018307730006, -0.119987534677]
    - [-0.016767487109,  0.999856203057, -0.002534676056,  0.007718909353]
    - [-0.018347708175,  0.002226918364,  0.999829186631,  0.014391259738]
    - [ 0.0,             0.0,             0.0,             1.0]

  T_base_left_to_base_right:
    - [ 0.999691058767, -0.016767487108, -0.018347708176,  0.120343938927]
    - [ 0.016811128494,  0.999856203058,  0.002226918363, -0.005732721695]
    - [ 0.018307730006, -0.002534676057,  0.999829186631, -0.012172537194]
    - [ 0.0,             0.0,             0.0,             1.0]

# RealSense 头部相机序列号
camera:
  head_serial: "153122071777"
  right_wrist_serial: "405622073249"
  left_wrist_serial: "335522072194"
  width: 640
  height: 480
  fps: 30

# 语音合成配置 - iFlytek WebAPI
# 凭证不要提交到仓库；本地填入真实值或改用环境变量。
speech:
  app_id: "YOUR_IFLYTEK_APP_ID"
  api_key: "YOUR_IFLYTEK_API_KEY"
  api_secret: "YOUR_IFLYTEK_API_SECRET"

# 大语言模型配置
# 凭证不要提交到仓库；本地填入真实值或改用环境变量。
llm:
  gemini_api_key: "YOUR_GEMINI_API_KEY"
  model_name: "gemini-2.5-flash"

# 计算机视觉配置
vision:
  model_path: "intelligence/yolo_models/8_17.pt"
